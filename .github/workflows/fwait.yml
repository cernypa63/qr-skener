name: fwait pro Windows

on:
  push:
    paths:
      - "fwait/**"
      - ".github/workflows/fwait.yml"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: fwait
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Testy
        run: dotnet test tests
      - name: Sestavení
        run: dotnet build src -c Release -o out
      - name: Kontrola spuštění
        shell: pwsh
        run: |
          $t = $env:RUNNER_TEMP
          $out = ./out/fwait.exe "$t\nic.pdf" 1 "$t\chyba.pdf"
          if ($LASTEXITCODE -ne 2 -or $out) { exit 1 }
          Get-Content "$t\chyba.pdf"
          Set-Content "$t\zdroj.txt" "ahoj"
          ./out/fwait.exe "$t\zdroj.txt" 5 "$t\kopie\cil.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ((Get-Content "$t\kopie\cil.txt") -ne "ahoj") { exit 1 }
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: fwait-windows
          path: fwait/out/fwait.exe
